name: Nightly backup

# pg_dump of the production database, encrypted, kept as a workflow artifact for 30 days.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   BACKUP_DATABASE_URL  the Postgres connection string (Neon: use the unpooled one)
#   BACKUP_PASSPHRASE    a long random passphrase; keep a copy in your password manager
# The repository is public and anyone signed in to GitHub can download artifacts,
# so the job refuses to run without encryption.

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 02:00 Malaysia time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then echo "::error::BACKUP_DATABASE_URL secret is not set"; exit 1; fi
          if [ ${#BACKUP_PASSPHRASE} -lt 20 ]; then echo "::error::BACKUP_PASSPHRASE must be set (20+ characters)"; exit 1; fi

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: sh scripts/backup.sh

      - uses: actions/upload-artifact@v4
        with:
          name: course-tracker-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backups/*.gpg
          retention-days: 30
          if-no-files-found: error
