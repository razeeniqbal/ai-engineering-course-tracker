<form method="post" action="/study" {% if not fixed_module %}hx-post="/study" hx-target="find .result" data-reset-on-success{% endif %}>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="row">
    {% if fixed_module %}
    <input type="hidden" name="module_number" value="{{ fixed_module.number }}">
    {% else %}
    <div>
      <label for="study-module">Module</label>
      <select id="study-module" name="module_number" required>
        {% for m in modules %}
        <option value="{{ m.module.number }}" {% if m.module.number == default_module %}selected{% endif %}>{{ m.module.number }}. {{ m.module.title }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
    <div class="narrow">
      <label for="study-min">Minutes</label>
      <input id="study-min" name="minutes" type="number" min="1" max="1440" inputmode="numeric" required>
    </div>
    <div class="mid">
      <label for="study-date">Date</label>
      <input id="study-date" name="studied_on" type="date" value="{{ today }}">
    </div>
  </div>
  <label for="study-note">Note (one line)</label>
  <input id="study-note" name="note" type="text" maxlength="500">
  <p></p>
  <button type="submit">Log time</button> <span class="result" aria-live="polite"></span>
</form>
