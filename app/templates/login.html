{% extends "base.html" %}
{% block title %}Sign in · Course Tracker{% endblock %}
{% block body %}
<main class="login-wrap">
  <div class="login">
    <div class="brand-mark">{{ ui.icon("spark") }}</div>
    <h1>Course Tracker</h1>
    <p class="sub">Sign in to log your progress</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}" autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="block" type="submit">Sign in</button></div>
    </form>
  </div>
</main>
{% endblock %}
